
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog 我的部落格</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <div class="container">
        <h1>My Blog 我的部落格</h1>
        <p>A little space for my thoughts 我的心情與文字小天地</p>
    </div>
</header>

<main class="container">
    <h2>All Posts 所有文章</h2>

    <a class="button" href="{{ url_for('new_post') }}">
        + New Post 新增文章
    </a>

    {% for post in posts %}
        <article class="post-card">
            <h2>
                <a href="{{ url_for('post_detail', post_id=post.id) }}">
                    {{ post.title }}
                </a>
            </h2>

            <p class="post-meta">
                Author 作者：{{ post.author }}
            </p>

            <div class="post-content">{{ post.content }}</div>

            <p>
                <a href="{{ url_for('post_detail', post_id=post.id) }}">
                    Read More 閱讀更多 →
                </a>
            </p>
        </article>
    {% else %}
        <div class="post-card">
            <p>No posts yet 目前還沒有文章。</p>
        </div>
    {% endfor %}
</main>

<footer>
    <div class="container">
        Made with love 用心製作的部落格 ♥
    </div>
</footer>

</body>
</html>
