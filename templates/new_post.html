<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>New Post 新增文章 - My Blog 我的部落格</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="container">
        <h1>My Blog 我的部落格</h1>
        <p>A little space for my thoughts 我的心情與文字小天地</p>
    </div>
</header>

<main class="container">

    <p>
        <a href="{{ url_for('index') }}">
            ← Back to Home 返回首頁
        </a>
    </p>

    <section class="post-card">

        <h1>New Post 新增文章</h1>

        <p>
            Share your thoughts with the world
            與大家分享你的想法
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST"
              action="{{ url_for('new_post') }}">

            <label for="title">
                Post Title 文章標題
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ title }}"
                placeholder="Enter your title 請輸入文章標題"
                required
            >

            <label for="author">
                Author 作者
            </label>

            <input
                type="text"
                id="author"
                name="author"
                value="{{ author }}"
                placeholder="Enter your name 請輸入作者名稱"
                required
            >

            <label for="content">
                Post Content 文章內容
            </label>

            <textarea
                id="content"
                name="content"
                rows="10"
                placeholder="Write your story here 在這裡寫下你的故事"
                required
            >{{ content }}</textarea>

            <button class="button" type="submit">
                Publish Post 發布文章
            </button>

        </form>

    </section>

    <p>
        <a href="{{ url_for('index') }}">
            ← Back to Home 返回首頁
        </a>
    </p>

</main>

<footer>
    <div class="container">
        Made with love 用心製作的部落格 ♥
    </div>
</footer>

</body>
</html>
